<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>小型工程請款登錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blueprint-900:#0F2D4A;
    --blueprint-700:#1B3B5F;
    --blueprint-500:#2F5D8A;
    --blueprint-line:#3E71A3;
    --paper:#FBF9F4;
    --paper-dim:#F1EDE3;
    --ink:#1F2A33;
    --ink-soft:#5B6672;
    --amber:#E8A33D;
    --amber-dark:#C6821F;
    --green:#3E8E5A;
    --green-bg:#E4F1E8;
    --amber-bg:#FBF0DD;
    --red:#B0392B;
    --red-bg:#FAE6E2;
    --border:#D8D1C0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper-dim);font-family:'Noto Sans TC',sans-serif;color:var(--ink);min-height:100vh;padding-bottom:48px;}
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    background:
      repeating-linear-gradient(0deg, transparent 0 27px, var(--blueprint-line) 27px 28px),
      repeating-linear-gradient(90deg, transparent 0 27px, var(--blueprint-line) 27px 28px),
      linear-gradient(160deg, var(--blueprint-900), var(--blueprint-700));
    background-size: 28px 28px, 28px 28px, 100% 100%;
    background-blend-mode: overlay, overlay, normal;
    color:#fff;padding:22px 18px 18px;border-bottom:4px solid var(--amber);position:relative;
  }
  header .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#BFD4E8;font-weight:500;margin-bottom:4px;}
  header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em;}
  header .sub{font-size:12px;color:#9FBBD6;margin-top:4px;font-family:'JetBrains Mono',monospace;}

  .totals-bar{display:flex;gap:10px;margin:14px -4px 0;padding:0 4px;overflow-x:auto;}
  .stat{flex:1 1 0;min-width:82px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:var(--radius);padding:8px 10px;}
  .stat .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--amber);}
  .stat.status-green .num{color:#7FD99A;}
  .stat.status-red .num{color:#F2A69B;}
  .stat .lbl{font-size:10.5px;color:#CBDCEC;margin-top:2px;}

  .tabs{display:flex;gap:8px;padding:14px 16px 0;max-width:640px;margin:0 auto;}
  .tab-btn{flex:1;padding:11px 8px;border-radius:999px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink-soft);font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;}
  .tab-btn.active{background:var(--blueprint-700);border-color:var(--blueprint-700);color:#fff;}

  main{max-width:640px;margin:0 auto;padding:14px 16px 0;}

  .card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,45,74,0.05);}
  .card-title{font-weight:900;font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .card-title .tag{background:var(--amber);color:var(--blueprint-900);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;}
  .card-subtitle{font-weight:700;font-size:12.5px;color:var(--blueprint-700);margin:0 0 10px;border-top:1px dashed var(--border);padding-top:12px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--blueprint-700);margin-bottom:5px;}
  .field .hint{font-weight:400;color:var(--ink-soft);font-size:11px;}
  input[type=text], input[type=number], input[type=date], input[type=password], select, textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;
    font-family:'Noto Sans TC',sans-serif;background:#fff;color:var(--ink);
  }
  input[type=number], .num-input{font-family:'JetBrains Mono',monospace;}
  textarea{resize:vertical;min-height:56px;font-family:'Noto Sans TC',sans-serif;}
  input:focus, select:focus, textarea:focus{outline:2.5px solid var(--amber);outline-offset:0;border-color:var(--amber-dark);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .amt-box{background:var(--paper-dim);border:1.5px dashed var(--blueprint-500);border-radius:8px;padding:10px 12px;}
  .amt-box .row2{margin-top:8px;}
  .amt-locked{background:var(--paper-dim);border:1.5px dashed var(--border);border-radius:8px;padding:16px 12px;text-align:center;}
  .amt-locked .msg{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}

  .status-toggle{display:flex;gap:8px;}
  .status-opt{flex:1;text-align:center;padding:11px 6px;border-radius:8px;border:1.5px solid var(--border);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink-soft);background:#fff;}
  .status-opt.sel-red{border-color:var(--red);background:var(--red-bg);color:var(--red);}
  .status-opt.sel-green{border-color:var(--green);background:var(--green-bg);color:var(--green);}

  .check-item{background:var(--paper-dim);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
  .check-item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ci-label{font-size:13px;font-weight:700;color:var(--ink);}
  .ci-toggle{display:flex;gap:6px;flex-shrink:0;}
  .ci-btn{width:38px;height:32px;border-radius:7px;border:1.5px solid var(--border);background:#fff;color:var(--ink-soft);font-weight:900;font-size:14px;}
  .ci-btn.sel-green{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .ci-btn.sel-red{border-color:var(--red);background:var(--red-bg);color:var(--red);}
  .ci-note{margin-top:8px;font-size:13.5px;padding:8px 10px;}
  .ci-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .ci-row2 input{font-size:13.5px;padding:8px 10px;}

  .photo-stage{margin-bottom:14px;}
  .photo-stage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
  .photo-stage-head .lbl{font-size:12.5px;font-weight:700;color:var(--blueprint-700);display:flex;align-items:center;gap:6px;}
  .photo-stage-head .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.before{background:#9AA7B2;}
  .dot.during{background:var(--amber-dark);}
  .dot.after{background:var(--green);}
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .photo-thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1.5px solid var(--border);background:var(--paper-dim);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .rm{position:absolute;top:2px;right:2px;width:19px;height:19px;background:rgba(15,45,74,0.85);color:#fff;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;line-height:1;}
  .photo-thumb.uploading::after{content:"⏳";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.6);font-size:20px;}
  .photo-add{width:72px;height:72px;border-radius:8px;border:1.5px dashed var(--blueprint-500);background:var(--paper-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--blueprint-700);font-size:22px;cursor:pointer;position:relative;}
  .photo-add span{font-size:9px;font-weight:700;margin-top:1px;}
  .photo-add input{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .btn-row{display:flex;gap:10px;margin-top:16px;}
  button{font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:none;}
  .btn-primary{flex:1;background:var(--amber);color:var(--blueprint-900);font-weight:900;font-size:15px;padding:13px;border-radius:8px;}
  .btn-primary:active{background:var(--amber-dark);}
  .btn-ghost{background:transparent;color:var(--ink-soft);font-weight:700;font-size:14px;padding:13px 16px;border-radius:8px;border:1.5px solid var(--border);}

  .list-toolbar{display:flex;gap:8px;margin-bottom:10px;}
  .list-toolbar input{flex:1;}
  .btn-export{background:var(--blueprint-700);color:#fff;font-weight:700;font-size:13px;padding:0 14px;border-radius:8px;white-space:nowrap;}

  .lock-row{display:flex;gap:8px;margin-bottom:10px;}
  .lock-btn{flex:1;background:var(--blueprint-900);color:#fff;font-weight:700;font-size:12.5px;padding:10px;border-radius:8px;}
  .lock-btn.unlocked{background:var(--green);}
  .change-pin-btn{flex:0 0 auto;background:transparent;border:1.5px solid var(--border);color:var(--ink-soft);font-weight:700;font-size:12px;padding:0 12px;border-radius:8px;}

  .filter-row{display:flex;gap:6px;margin-bottom:12px;}
  .filter-btn{flex:1;padding:8px 6px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--ink-soft);font-weight:700;font-size:12.5px;}
  .filter-btn.active{background:var(--blueprint-700);border-color:var(--blueprint-700);color:#fff;}

  .empty{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty .big{font-size:34px;margin-bottom:6px;}

  .entry{position:relative;background:var(--paper);border:1px solid var(--border);border-left:5px solid var(--red);border-radius:var(--radius);padding:16px 14px 14px;margin-bottom:16px;}
  .entry.is-done{border-left-color:var(--green);}
  .entry::before{content:"";position:absolute;top:-1px;left:0;right:0;height:0;border-top:2.5px dashed var(--border);}
  .entry::after{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:26px;height:16px;background:radial-gradient(circle at 50% 100%, transparent 8px, var(--paper-dim) 8.5px);}
  .entry-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .entry-idx{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--blueprint-500);font-weight:700;}
  .status-pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;}
  .status-pill.green{background:var(--green-bg);color:var(--green);}
  .status-pill.red{background:var(--red-bg);color:var(--red);}
  .entry-site{font-size:16px;font-weight:900;color:var(--ink);margin-top:2px;}
  .entry-addr{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .entry-amt{text-align:right;flex-shrink:0;}
  .entry-amt .main{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;color:var(--amber-dark);}
  .entry-amt .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .entry-amt .locked-tag{font-size:12.5px;color:var(--ink-soft);font-weight:700;}
  .entry-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px;font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .chip.item{background:var(--paper-dim);color:var(--blueprint-700);border:1px solid var(--border);}
  .chip.ok{background:var(--green-bg);color:var(--green);}
  .chip.warn{background:var(--amber-bg);color:var(--amber-dark);}
  .chip.bad{background:var(--red-bg);color:var(--red);}

  .pay-pill{margin-top:11px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:8px;font-weight:900;font-size:13.5px;border:1.5px solid var(--border);}
  .pay-pill.paid{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .pay-pill.unpaid{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .pay-pill.locked{opacity:0.72;}

  .entry-note{margin-top:9px;font-size:12.5px;color:var(--ink);background:var(--paper-dim);border-radius:6px;padding:7px 9px;line-height:1.6;}
  .entry-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;border-top:1px solid var(--border);padding-top:10px;}
  .icon-btn{background:transparent;border:1.5px solid var(--border);border-radius:7px;padding:8px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .icon-btn.danger{color:var(--red);border-color:#E7C6C0;}
  .icon-btn.edit{color:var(--blueprint-700);border-color:var(--blueprint-500);}
  .icon-btn.photos{color:var(--amber-dark);border-color:var(--amber);}
  .icon-btn.download{color:var(--green);border-color:var(--green);}

  .photo-view{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
  .photo-view-stage{margin-bottom:10px;}
  .photo-view-stage:last-child{margin-bottom:0;}
  .photo-view-stage .lbl{font-size:11px;font-weight:700;color:var(--blueprint-700);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
  .photo-view-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .photo-view-grid img{width:64px;height:64px;object-fit:cover;border-radius:7px;border:1.5px solid var(--border);cursor:pointer;}
  .photo-none{font-size:11.5px;color:var(--ink-soft);}

  .loading-msg{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blueprint-900);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;white-space:nowrap;max-width:88vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(15,45,74,0.92);z-index:80;align-items:center;justify-content:center;padding:24px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
  .lightbox .close{position:absolute;top:18px;right:18px;width:36px;height:36px;background:rgba(255,255,255,0.15);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,45,74,0.55);z-index:90;align-items:center;justify-content:center;padding:24px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--paper);border-radius:var(--radius);padding:20px;max-width:340px;width:100%;box-shadow:0 8px 30px rgba(15,45,74,0.25);}
  .modal-box p{font-size:14.5px;color:var(--ink);margin:0 0 12px;line-height:1.6;}
  .modal-actions{display:flex;gap:10px;margin-top:4px;}

  .conn-error{
    max-width:640px;margin:14px auto 0;padding:0 16px;
  }
  .conn-error .box{
    background:var(--red-bg);border:1.5px solid var(--red);border-radius:var(--radius);
    padding:14px;font-size:13px;color:var(--red);line-height:1.6;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">小型工程 · 現場登錄</div>
  <h1>工程請款登錄</h1>
  <div class="sub">派工單 → 請款明細 · 團隊共用</div>
  <div class="totals-bar" id="totalsBar"></div>
</header>

<div id="connError" class="conn-error" style="display:none;">
  <div class="box" id="connErrorMsg"></div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabAdd" onclick="switchTab('add')">＋ 新增請款</button>
  <button class="tab-btn" id="tabList" onclick="switchTab('list')">📋 請款列表</button>
</div>

<main>
  <div id="viewAdd"></div>
  <div id="viewList" style="display:none;"></div>
</main>

<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="close">✕</div>
  <img id="lightboxImg" src="" onclick="event.stopPropagation()">
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal-box" onclick="event.stopPropagation()">
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button class="btn-ghost" style="flex:1;" onclick="closeConfirm(false)">取消</button>
      <button class="btn-primary" style="background:var(--red);color:#fff;" onclick="closeConfirm(true)">確定刪除</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pinModal">
  <div class="modal-box" onclick="event.stopPropagation()">
    <p id="pinModalTitle" style="font-weight:900;margin-bottom:2px;"></p>
    <p id="pinModalDesc" style="font-size:12.5px;color:var(--ink-soft);"></p>
    <input type="password" inputmode="numeric" id="pinInput" placeholder="請輸入密碼" style="margin-bottom:8px;">
    <input type="password" inputmode="numeric" id="pinInput2" placeholder="再輸入一次確認" style="display:none;margin-bottom:8px;">
    <p id="pinError" style="color:var(--red);font-size:12px;display:none;margin:0 0 8px;"></p>
    <div class="modal-actions">
      <button class="btn-ghost" style="flex:1;" onclick="closePinModal()">取消</button>
      <button class="btn-primary" onclick="submitPinModal()">確認</button>
    </div>
  </div>
</div>

<script>
/* ============== Supabase connection ==============
   The anon/publishable key below is DESIGNED to be public — Supabase's
   security model relies on Row Level Security policies (already set up),
   not on hiding this key. */
const SUPABASE_URL = 'https://nwjtbbnsepmdlpqxfpmt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0JGW8ek-R-Ww05A6cxXHxw_BYv8DSWG';
const PHOTOS_BUCKET = 'photos';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ENTRIES_KEY = 'billing-entries';
const PIN_KEY = 'admin-pin';
let entries = [];
let editingId = null;
let expandedPhotoIds = {};
let filterPaid = 'all';
let isUnlocked = false;
let adminPin = null;
let pinModalMode = 'enter';

function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){ return (Number(n)||0).toLocaleString('zh-TW'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}
function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); }
function showConnError(msg){
  document.getElementById('connErrorMsg').textContent = msg;
  document.getElementById('connError').style.display = 'block';
}

/* ---------------- custom confirm ---------------- */
let _confirmResolve = null;
function showConfirm(msg){
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmModal').classList.add('show');
  return new Promise(resolve => { _confirmResolve = resolve; });
}
function closeConfirm(result){
  document.getElementById('confirmModal').classList.remove('show');
  if(_confirmResolve) _confirmResolve(result);
  _confirmResolve = null;
}

/* ---------------- key/value store on Supabase (table: app_kv) ---------------- */
async function kvGet(key){
  const { data, error } = await sb.from('app_kv').select('value').eq('key', key).maybeSingle();
  if(error) throw error;
  return data ? data.value : null;
}
async function kvSet(key, value){
  const { error } = await sb.from('app_kv').upsert({ key, value, updated_at: new Date().toISOString() });
  if(error) throw error;
}

/* ---------------- PIN lock: gates payment-status toggling AND all price figures ---------------- */
async function loadAdminPin(){
  try{
    const v = await kvGet(PIN_KEY);
    adminPin = (typeof v === 'string') ? v : '';
  }catch(e){ adminPin = ''; }
  if(!adminPin){
    adminPin = '0000';
    try{ await kvSet(PIN_KEY, adminPin); }catch(e){}
  }
}
function openPinModal(){
  pinModalMode = adminPin ? 'enter' : 'set';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinInput2').value = '';
  document.getElementById('pinInput2').style.display = pinModalMode==='set' ? 'block' : 'none';
  document.getElementById('pinError').style.display = 'none';
  if(pinModalMode==='set'){
    document.getElementById('pinModalTitle').textContent = '設定管理密碼';
    document.getElementById('pinModalDesc').textContent = '設定後，之後只有輸入正確密碼才能查看金額及勾選請款狀態。';
    document.getElementById('pinInput').placeholder = '設定密碼';
  }else{
    document.getElementById('pinModalTitle').textContent = '輸入管理密碼';
    document.getElementById('pinModalDesc').textContent = '查看/填寫金額、勾選請款狀態為管理者專屬功能。';
    document.getElementById('pinInput').placeholder = '請輸入密碼';
  }
  document.getElementById('pinModal').classList.add('show');
  setTimeout(()=>document.getElementById('pinInput').focus(), 50);
}
function openChangePinModal(){
  pinModalMode = 'change';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinInput2').style.display = 'none';
  document.getElementById('pinError').style.display = 'none';
  document.getElementById('pinModalTitle').textContent = '變更管理密碼';
  document.getElementById('pinModalDesc').textContent = '設定新的管理密碼給自己使用。';

function padMeter(v){

}

/* ---------------- photo upload (Supabase Storage) ---------------- */
function compressImageToBlob(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const maxDim = 1100;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('compress failed')), 'image/jpeg', 0.62);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadOnePhoto(entryId, stage, file){
  const blob = await compressImageToBlob(file);
  const fileName = `${entryId}/${stage}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.jpg`;
  const { error } = await sb.storage.from(PHOTOS_BUCKET).upload(fileName, blob, { contentType:'image/jpeg', upsert:false });
  if(error) throw error;
  const { data } = sb.storage.from(PHOTOS_BUCKET).getPublicUrl(fileName);
  return { path: fileName, url: data.publicUrl };
}
async function deleteStoredPhotos(paths){
  if(!paths || paths.length===0) return;
  try{ await sb.storage.from(PHOTOS_BUCKET).remove(paths); }catch(e){ /* non-fatal */ }
}

  const files = Array.from(input.files || []);
  input.value = '';
  if(files.length === 0) return;
  let done = 0;
  showToast(`上傳中... (0/${files.length})`);
  for(const f of files){
    try{
      const photo = await uploadOnePhoto(form.id, stage, f);
      form.photos[stage].push(photo);
      done++;
      updatePhotoStageDOM(stage);
      showToast(`上傳中... (${done}/${files.length})`);

      showToast('照片上傳失敗，請檢查網路連線');

  if(stage === 'after' && form.photos.after.length > 0){

    renderStatusToggle();
  }
  if(done > 0) showToast(`已上傳 ${done} 張照片`);

  }
  form.meterNo = padMeter(form.meterNo);

  const data = {
    id: form.id,
    date: form.date || todayStr(),
    workOrder: form.workOrder.trim(),
    meterNo: form.meterNo,
    siteName: form.siteName.trim(),
    address: form.address.trim(),
    item: finalItem,
    note: form.note.trim(),
    status: form.status,
    checks: JSON.parse(JSON.stringify(form.checks)),
    photos: JSON.parse(JSON.stringify(form.photos)),
  };
  if(isUnlocked){
    data.untaxed = form.untaxed;
    data.tax = form.tax;
    data.taxed = form.taxed;
  }
  if(editingId){
    const idx = entries.findIndex(e=>e.id===editingId);
    if(idx>-1) entries[idx] = {...entries[idx], ...data};
    showToast('已儲存修改');
    editingId = null;
  }else{
    entries.push({createdAt: Date.now(), paid:false, untaxed:'', tax:'', taxed:'', ...data});
    showToast('已新增一筆請款');
  }
  await saveEntries();
  form = emptyForm();

  renderTotals();
  renderList();
  switchTab('list');
}

  const meterDisplay = padMeter(e.meterNo);
  const idxNum = entries.length - entries.findIndex(x=>x.id===e.id);
  return `
    <div class="entry ${done?'is-done':''}">
      <div class="entry-head">
        <div>
          <div class="entry-idx">#${idxNum} · ${e.date||''}
            <span class="status-pill ${done?'green':'red'}">${done?'🟢 已完工':'🔴 施工中'}</span>
          </div>
          <div class="entry-site">${escHtml(e.siteName||'（未命名案場）')}</div>
          ${e.address ? `<div class="entry-addr">${escHtml(e.address)}</div>` : ''}
        </div>
        <div class="entry-amt">
          ${isUnlocked
            ? `<div class="main">$${fmtMoney(e.taxed || e.untaxed)}</div><div class="sub">未稅 $${fmtMoney(e.untaxed)}</div>`
            : `<div class="locked-tag">🔒 金額</div>`
          }
        </div>
      </div>
      <div class="entry-meta">
        ${e.workOrder ? `<span>單號 ${escHtml(e.workOrder)}</span>` : ''}
        ${meterDisplay ? `<span>電號 ${escHtml(meterDisplay)}</span>` : ''}
      </div>
      <div class="chips">
        <span class="chip item">${escHtml(e.item||'—')}</span>
        <span class="chip ${chipClass(c.netLocation&&c.netLocation.ok)}">網路 ${escHtml((c.netLocation&&c.netLocation.ok)||'-')}</span>
        <span class="chip ${chipClass(c.phaseLocation&&c.phaseLocation.ok)}">三相電 ${escHtml((c.phaseLocation&&c.phaseLocation.ok)||'-')}</span>
        <span class="chip ${chipClass(c.ct&&c.ct.ok)}">${escHtml(ctChipText(c))}</span>
        <span class="chip ${chipClass(c.meterPower&&c.meterPower.ok)}">開機 ${escHtml((c.meterPower&&c.meterPower.ok)||'-')}</span>
      </div>
      ${e.note ? `<div class="entry-note">${escHtml(e.note)}</div>` : ''}
      ${noteLines.length ? `<div class="entry-note">${noteLines.map(l=>escHtml(l)).join('<br>')}</div>` : ''}
      <button class="pay-pill ${paid?'paid':'unpaid'} ${isUnlocked?'':'locked'}" onclick="togglePaid('${e.id}')">
        ${paid ? '✅ 已請款' : '⬜ 未請款'}${isUnlocked?'':' 🔒'}
      </button>
      <div class="entry-actions">
        <button class="icon-btn photos" onclick="togglePhotoView('${e.id}')">📷 照片 ${totalPhotos ? '('+totalPhotos+')' : ''} ${expandedPhotoIds[e.id]?'▲':'▼'}</button>
        <button class="icon-btn download" onclick="downloadEntryPhotos('${e.id}')">📥 下載照片${totalPhotos ? ' ('+totalPhotos+')' : ''}</button>
        <button class="icon-btn edit" onclick="editEntry('${e.id}')">✏️ 編輯</button>
        <button class="icon-btn danger" onclick="deleteEntry('${e.id}')">🗑️ 刪除</button>
      </div>
      ${renderPhotoView(e)}
    </div>
  `;
}

function renderLockRow(){
  const el = document.getElementById('lockRow');
  if(!el) return;
  el.innerHTML = `
    <button class="lock-btn ${isUnlocked?'unlocked':''}" onclick="toggleLock()">${isUnlocked ? '🔓 已解鎖（點擊重新鎖定）' : '🔒 已鎖定（點擊輸入密碼解鎖）'}</button>
    ${isUnlocked ? `<button class="change-pin-btn" onclick="openChangePinModal()">變更密碼</button>` : ''}
  `;
}
function renderFilterRow(){
  const el = document.getElementById('filterRow');
  if(!el) return;
  el.innerHTML = `
    <button class="filter-btn ${filterPaid==='all'?'active':''}" onclick="setFilterPaid('all')">全部</button>
    <button class="filter-btn ${filterPaid==='unpaid'?'active':''}" onclick="setFilterPaid('unpaid')">未請款</button>
    <button class="filter-btn ${filterPaid==='paid'?'active':''}" onclick="setFilterPaid('paid')">已請款</button>
  `;
}
function renderEntriesOnly(filter){
  filter = (filter||'').trim().toLowerCase();
  const el = document.getElementById('entriesContainer');
  if(!el) return;
  const list = entries
    .filter(e => !filter || (e.siteName+e.meterNo+e.workOrder+e.address).toLowerCase().includes(filter))
    .filter(e => filterPaid==='all' || (filterPaid==='paid' ? !!e.paid : !e.paid))
    .sort((a,b)=> b.createdAt - a.createdAt);

  if(list.length===0){
    el.innerHTML = `
      <div class="empty">
        <div class="big">🗂️</div>
        ${entries.length===0 ? '尚無任何請款資料，點上方「新增請款」開始登錄。' : '找不到符合的資料。'}
      </div>`;
    return;
  }
  el.innerHTML = list.map(e => renderEntryCard(e)).join('');
}

function ensureListShell(){
  const wrap = document.getElementById('viewList');
  if(document.getElementById('entriesContainer')) return;
  wrap.innerHTML = `
    <div class="list-toolbar">
      <input type="text" id="searchBox" placeholder="搜尋案場 / 電號 / 派工單號" oninput="renderEntriesOnly(this.value)">
      <button class="btn-export" onclick="exportExcel()">Excel</button>
    </div>
    <div class="lock-row" id="lockRow"></div>
    <div class="filter-row" id="filterRow"></div>
    <div id="entriesContainer"></div>
  `;
}
function renderList(filter){
  ensureListShell();
  renderLockRow();
  renderFilterRow();
  renderEntriesOnly(filter !== undefined ? filter : currentSearch());
  if(filter){
    const sb2 = document.getElementById('searchBox');
    if(sb2) sb2.value = filter;
  }
}

function renderTotals(){
  const count = entries.length;
  const doneCount = entries.filter(e=>e.status==='已完工').length;
  const paidCount = entries.filter(e=>e.paid).length;
  const unpaidSum = entries.reduce((s,e)=> e.paid ? s : s+(parseFloat(e.taxed)||parseFloat(e.untaxed)||0), 0);
  document.getElementById('totalsBar').innerHTML = `
    <div class="stat"><div class="num mono">${count}</div><div class="lbl">總筆數</div></div>
    <div class="stat status-green"><div class="num mono">${doneCount}</div><div class="lbl">已完工</div></div>
    <div class="stat status-red"><div class="num mono">${count-doneCount}</div><div class="lbl">施工中</div></div>
    <div class="stat status-green"><div class="num mono">${paidCount}</div><div class="lbl">已請款</div></div>
    <div class="stat status-red"><div class="num mono">${count-paidCount}</div><div class="lbl">未請款</div></div>
    <div class="stat"><div class="num mono">${isUnlocked ? '$'+fmtMoney(unpaidSum) : '🔒'}</div><div class="lbl">待收金額</div></div>
  `;
}

/* ---------------- Excel export ---------------- */
function loadExcelJS(){
  return new Promise((resolve, reject)=>{
    if(window.ExcelJS){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}
function fmtCheckCell(obj){
  if(!obj) return '';
  let s = obj.ok || '';
  if(obj.note) s += (s?' ':'') + '(' + obj.note + ')';
  return s;
}
function fmtCTCell(ct){
  if(!ct) return '';
  const parts = [];
  if(ct.ok) parts.push(ct.ok);
  if(ct.lines) parts.push(ct.lines+'線');
  if(ct.ratio) parts.push(ct.ratio+'倍率');
  let s = parts.join(' ');
  if(ct.note) s += (s?' ':'') + '(' + ct.note + ')';
  return s;
}
async function exportExcel(){
  if(!isUnlocked){
    showToast('匯出內含金額資料，僅管理者可操作，請先解鎖');
    openPinModal();
    return;
  }
  if(entries.length===0){ showToast('目前沒有資料可匯出'); return; }
  showToast('準備 Excel 中，請稍候...');
  try{ await loadExcelJS(); }
  catch(e){ showToast('Excel 元件載入失敗，請檢查網路連線'); return; }

  const FONT = { name:'標楷體', size:11 };
  const headers = ['項次','日期','案場狀態','請款狀態','派工單號/工名','台電電號','案場名稱','施工地址','項目',
    '請款金額(未稅)','稅額','請款金額(含稅)',
    '現場網路連接位置','三相電連接位置','三線CT','電表能不能開機',
    '施工前照片數','施工中照片數','完工照片數','備註'];

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('請款明細');
  ws.addRow(headers);

  const sorted = [...entries].sort((a,b)=>a.createdAt-b.createdAt);
  const meterColIndex = headers.indexOf('台電電號') + 1;

  sorted.forEach((e,i)=>{
    const pc = photoCounts(e);
    const c = e.checks || {};
    ws.addRow([
      i+1, e.date, e.status, e.paid ? '已請款' : '未請款', e.workOrder, padMeter(e.meterNo), e.siteName, e.address, e.item,
      Number(e.untaxed)||0, Number(e.tax)||0, Number(e.taxed)||0,
      fmtCheckCell(c.netLocation), fmtCheckCell(c.phaseLocation), fmtCTCell(c.ct), fmtCheckCell(c.meterPower),
      pc.before, pc.during, pc.after,
      e.note || ''
    ]);
  });

  const widths = [6,11,9,9,16,15,16,24,8,12,10,12,20,20,20,18,8,8,8,26];
  ws.columns.forEach((col,idx)=>{ col.width = widths[idx] || 12; });

  ws.getColumn(meterColIndex).eachCell({includeEmpty:false}, (cell, rowNumber)=>{
    if(rowNumber===1) return;
    cell.value = { richText: [{ text: String(cell.value) }] };
    cell.numFmt = '@';
  });

  ws.eachRow({includeEmpty:false}, (row)=>{
    row.eachCell({includeEmpty:true}, (cell)=>{
      cell.font = FONT;
      cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
      cell.border = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
    });
  });

  const headerRow = ws.getRow(1);
  headerRow.font = { ...FONT, bold:true };
  headerRow.eachCell(cell=>{ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF3DDAF'} }; });
  headerRow.height = 22;
  ws.views = [{ state:'frozen', ySplit:1 }];

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `工程請款明細_${todayStr()}.xlsx`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Excel 已下載');
}

/* ---------------- per-entry photo ZIP download ---------------- */
function loadJSZip(){
  return new Promise((resolve, reject)=>{
    if(window.JSZip){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}
async function downloadEntryPhotos(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  const photos = e.photos || {before:[],during:[],after:[]};
  const totalCount = (photos.before||[]).length + (photos.during||[]).length + (photos.after||[]).length;
  if(totalCount===0){ showToast('這個案場尚未上傳照片'); return; }

  showToast('準備照片中，請稍候...');
  try{ await loadJSZip(); }
  catch(err){ showToast('下載元件載入失敗，請檢查網路連線'); return; }

  const stageFolder = {before:'施工前照片', during:'施工中照片', after:'完工照片'};
  const zip = new JSZip();
  let fileCount = 0;
  for(const stageKey of ['before','during','after']){
    const arr = photos[stageKey] || [];
    for(let idx=0; idx<arr.length; idx++){
      try{
        const res = await fetch(arr[idx].url);
        const blob = await res.blob();
        zip.file(`${stageFolder[stageKey]}/${idx+1}.jpg`, blob);
        fileCount++;
      }catch(err){ /* skip photo that failed to fetch */ }
    }
  }
  if(fileCount===0){ showToast('照片下載失敗，請檢查網路連線'); return; }

  const safeName = (e.siteName || '案場').replace(/[\\/:*?"<>|]/g,'_');
  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${safeName}_${e.date||todayStr()}_照片.zip`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`已下載 ${fileCount} 張照片`);
}

/* ---------------- helpers ---------------- */
function escHtml(s){ return String(s??'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }

/* ---------------- tabs ---------------- */
function switchTab(tab){
  document.getElementById('tabAdd').classList.toggle('active', tab==='add');
  document.getElementById('tabList').classList.toggle('active', tab==='list');
  document.getElementById('viewAdd').style.display = tab==='add' ? 'block' : 'none';
  document.getElementById('viewList').style.display = tab==='list' ? 'block' : 'none';
  if(tab==='list') renderList();
}

/* ---------------- init ---------------- */
async function init(){
  document.getElementById('viewAdd').innerHTML = '<div class="loading-msg">載入中...</div>';
  try{
    await loadEntries();
    await loadAdminPin();
  }catch(e){
    showConnError('無法連線到資料庫，請檢查網路連線，或確認 Supabase 專案的資料表／權限設定是否正確。錯誤訊息：' + (e && e.message ? e.message : e));
  }
  renderAddView();
  renderTotals();
  renderList();
}
init();
</script>
